<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elementia — Story Mode Simulator</title>
<style>
  :root{ --ink:#e8edf4; --mute:#8a97a8; --bg:#0e1218; --card:#171d26; --line:#2b3442;
         --ok:#3fb46c; --warn:#e0b23f; --bad:#e05a4a; --accent:#4d7cf2; }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--ink);
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }
  header{
    padding:10px 16px; border-bottom:1.5px solid var(--line); display:flex; align-items:baseline;
    gap:14px; flex-wrap:wrap; flex:0 0 auto;
  }
  header h1{font-size:15px; font-weight:800; margin:0; letter-spacing:.3px}
  header .sub{font-size:11.5px; color:var(--mute)}
  header .spacer{flex:1}
  .btnrow{display:flex; gap:6px; flex-wrap:wrap}
  button{
    font:inherit; font-weight:700; font-size:12px; padding:6px 11px; border-radius:8px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
  }
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button:hover{filter:brightness(1.15)}
  button:disabled{opacity:.4; cursor:default; filter:none}
  button.small{padding:3px 7px; font-size:11px; border-radius:6px}
  main{flex:1; display:flex; min-height:0}
  #graphPane{flex:1 1 60%; position:relative; overflow:auto; background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0/18px 18px, var(--bg);}
  #graphSvg{display:block}
  .node-label{font-size:9.5px; font-weight:700; fill:var(--ink); pointer-events:none; text-anchor:middle}
  .node-emoji{font-size:15px; text-anchor:middle; pointer-events:none}
  .edge{stroke:rgba(255,255,255,.10); stroke-width:1.3; fill:none}
  .edge.hi{stroke:var(--warn); stroke-width:2.2; opacity:.9}
  .node-circ{stroke-width:2; cursor:pointer}
  .node-circ.unrevealed{fill:#1c2330; stroke:#333d4d}
  .node-circ.revealed{stroke:var(--suit,#4d7cf2)}
  .node-circ.just{stroke:var(--warn); stroke-width:3.5}
  .node-circ.selected{stroke:#fff; stroke-width:3}
  #sidePane{
    flex:0 0 340px; border-left:1.5px solid var(--line); display:flex; flex-direction:column;
    min-height:0; background:var(--card);
  }
  .side-section{padding:10px 14px; border-bottom:1.5px solid var(--line)}
  .side-section h2{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--mute);
    font-weight:800; margin:0 0 8px}
  .scrub-row{display:flex; align-items:center; gap:8px}
  input[type=range]{flex:1}
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px}
  .stat{background:#12161f; border:1px solid var(--line); border-radius:8px; padding:6px 8px}
  .stat .n{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums}
  .stat .l{font-size:9px; color:var(--mute); text-transform:uppercase; letter-spacing:.3px}
  #missionList{flex:1; overflow-y:auto; padding:6px 10px}
  .mrow{
    display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:7px; font-size:12px;
    border:1px solid transparent; cursor:pointer;
  }
  .mrow:hover{background:#1e2632}
  .mrow.current{border-color:var(--warn); background:#241f14}
  .mrow.done{opacity:.5}
  .mrow .idx{width:22px; color:var(--mute); font-variant-numeric:tabular-nums; font-size:10.5px}
  .mrow .em{width:18px; text-align:center}
  .mrow .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mrow .av{color:var(--mute); font-size:10px; font-variant-numeric:tabular-nums}
  .mrow .mbtns{display:none; gap:2px}
  .mrow:hover .mbtns{display:flex}
  .orphans{font-size:11px; color:var(--bad); padding:0 14px 10px; line-height:1.6}
  select, input[type=text]{
    font:inherit; font-size:12px; background:#12161f; color:var(--ink); border:1.5px solid var(--line);
    border-radius:7px; padding:5px 7px; width:100%;
  }
  .hint{font-size:10.5px; color:var(--mute); line-height:1.5; margin-top:6px}
  #detailPane{padding:8px 14px; font-size:11.5px; line-height:1.7; max-height:140px; overflow-y:auto}
  #detailPane b{color:var(--ink)}
  #detailPane .rec{color:var(--mute)}
</style>
</head>
<body>

<header>
  <h1>🗺️ Elementia — Story Mode Simulator</h1>
  <span class="sub">experiment with mission reveal order &amp; watch item coverage grow</span>
  <div class="spacer"></div>
  <div class="btnrow">
    <button id="exportBtn">⬇ Export order</button>
    <button id="importBtn">⬆ Import order</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <button id="resetOrderBtn">↺ Reset to default (AvgVisits)</button>
  </div>
</header>

<main>
  <div id="graphPane"><svg id="graphSvg"></svg></div>
  <div id="sidePane">
    <div class="side-section">
      <h2>Simulate</h2>
      <div class="scrub-row">
        <button class="small" id="stepBackBtn">⏮</button>
        <input type="range" id="scrubber" min="0" max="0" value="0">
        <button class="small" id="stepFwdBtn">⏭</button>
      </div>
      <div class="btnrow" style="margin-top:6px">
        <button id="playBtn" class="primary">▶ Play</button>
        <button id="resetSimBtn">↺ Reset</button>
      </div>
    </div>
    <div class="side-section">
      <h2>Coverage</h2>
      <div class="stats">
        <div class="stat"><div class="n" id="statRevealed">0</div><div class="l">Revealed</div></div>
        <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Total items</div></div>
        <div class="stat"><div class="n" id="statOrphans">0</div><div class="l">Never covered</div></div>
      </div>
    </div>
    <div class="side-section" style="border-bottom:none; flex:0 0 auto">
      <h2>Mission order <span id="missionCount" style="color:var(--mute);font-weight:400"></span></h2>
      <select id="addMissionSelect"><option value="">+ add item back to the order…</option></select>
    </div>
    <div id="missionList"></div>
    <div id="orphanBox" class="orphans" style="display:none"></div>
    <div id="detailPane" class="side-section"><span style="color:var(--mute)">Click a node in the graph for details.</span></div>
  </div>
</main>

  "Sheep": 8.2,
  "Cow": 8.7,
  "Star": 17.0,
  "The Black Pearl": null,
  "Glass": 5.6,
  "Mushroom": 5.8,
  "Bread": 22.7,
  "Volcano": 14.5
 }
}/*__STORY_DATA_END__*/;
</script>
<script>
(function(){
  const ELEMENTS = new Set(["C","H","O","N","Ca","Si","Al","Ag","Ni","Cu","Fe","K","P","S","Mg","Ti"]);

  // ---- flatten catalog -----------------------------------------------------
  const items = []; // {name, emoji, tier, station, suit, points, recipe, itemDeps:[names], avgVisits}
  const byName = {};
  DATA.stations.forEach(st => {
    const suit = DATA.suits[st.suit] || {color:"#8a94a6"};
    function add(emoji, name, tier, recipe, points) {
      // A handful of MATERIAL items (Water, Clay, Sand, ...) are sold at
      // 2-3 stations with an identical recipe -- one graph node per NAME,
      // not one per shop listing, or the graph and mission list would show
      // the same item duplicated 2-3x. Just record every station it's
      // available at on the node we already have.
      if (byName[name]) { byName[name].stations.push(st.name); return; }
      const deps = recipe.split(" + ").map(t => t.trim()).filter(tok => {
        return !ELEMENTS.has(tok);
      }).map(tok => {
        const sp = tok.indexOf(" ");
        return sp < 0 ? tok : tok.slice(sp + 1);
      });
      const it = { name, emoji, tier, station: st.name, stations: [st.name], suitColor: suit.color,
        points, recipe, itemDeps: deps, avgVisits: DATA.avgVisits[name] };
      items.push(it);
      byName[name] = it;
    }
    st.shop.forEach(([e,n,tag,rec,pt]) => add(e,n,tag,rec,pt));
    // Sub-zone "stations" (see build_story_sim.py's subzone_stations())
    // mostly have no capstone at all -- every planet, Island.
    if (st.capstone){
      const [ce,cn,ct,cr,cpt] = st.capstone;
      add(ce,cn,ct,cr,cpt);
    }
  });

  // depth = 1 + max(depth of item deps), 0 if no item deps
  const depthCache = {};
  function depthOf(name, seen) {
    if (depthCache[name] != null) return depthCache[name];
    seen = seen || new Set();
    if (seen.has(name)) return 0; // guard against accidental cycles
    seen.add(name);
    const it = byName[name];
    if (!it || !it.itemDeps.length) return depthCache[name] = 0;
    const d = 1 + Math.max(...it.itemDeps.map(d => depthOf(d, seen)));
    return depthCache[name] = d;
  }
  items.forEach(it => depthOf(it.name));

  // full recursive component closure (every item ancestor, excluding self)
  const closureCache = {};
  function closureOf(name) {
    if (closureCache[name]) return closureCache[name];
    const seen = new Set();
    (function visit(n){
      const it = byName[n];
      if (!it) return;
      it.itemDeps.forEach(d => { if (!seen.has(d)) { seen.add(d); visit(d); } });
    })(name);
    return closureCache[name] = seen;
  }

  // ---- layout ---------------------------------------------------------------
  const byDepth = {};
  items.forEach(it => { (byDepth[depthOf(it.name)] = byDepth[depthOf(it.name)] || []).push(it); });
  const maxDepth = Math.max(...Object.keys(byDepth).map(Number));
  const COL_W = 118, ROW_H = 46, PAD = 40, R = 15;
  Object.keys(byDepth).forEach(d => {
    byDepth[d].sort((a,b) => (a.avgVisits||0) - (b.avgVisits||0));
    byDepth[d].forEach((it, i) => {
      it.x = PAD + Number(d) * COL_W;
      it.y = PAD + i * ROW_H;
    });
  });
  const svgW = PAD * 2 + (maxDepth + 1) * COL_W;
  const svgH = PAD * 2 + Math.max(...Object.values(byDepth).map(a => a.length)) * ROW_H;

  const svg = document.getElementById("graphSvg");
  svg.setAttribute("width", svgW);
  svg.setAttribute("height", svgH);
  svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);

  const edgesG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const nodesG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  svg.appendChild(edgesG);
  svg.appendChild(nodesG);

  const edgeEls = []; // {el, from, to}
  items.forEach(it => {
    it.itemDeps.forEach(dep => {
      const from = byName[dep];
      if (!from) return;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const dx = (from.x + R + 6), dy = from.y, ex = (it.x - R - 6), ey = it.y;
      const mx = (dx + ex) / 2;
      path.setAttribute("d", `M ${dx} ${dy} C ${mx} ${dy}, ${mx} ${ey}, ${ex} ${ey}`);
      path.setAttribute("class", "edge");
      edgesG.appendChild(path);
      edgeEls.push({ el: path, from: dep, to: it.name });
    });
  });

  const nodeEls = {};
  items.forEach(it => {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("transform", `translate(${it.x},${it.y})`);
    const circ = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circ.setAttribute("r", R);
    circ.setAttribute("class", "node-circ unrevealed");
    circ.style.setProperty("--suit", it.suitColor);
    const em = document.createElementNS("http://www.w3.org/2000/svg", "text");
    em.setAttribute("class", "node-emoji");
    em.setAttribute("y", 5);
    em.textContent = it.emoji.replace(/^(__).*(__)$/, "⭐");
    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("class", "node-label");
    label.setAttribute("y", R + 11);
    label.textContent = it.name.length > 14 ? it.name.slice(0,13) + "…" : it.name;
    g.appendChild(circ); g.appendChild(em); g.appendChild(label);
    g.addEventListener("click", () => selectNode(it.name));
    nodesG.appendChild(g);
    nodeEls[it.name] = { g, circ };
  });

  // ---- mission state ----------------------------------------------------
  const DEFAULT_ORDER = items.slice().sort((a,b) => (a.avgVisits||0) - (b.avgVisits||0))
    .filter(it => it.tier !== "CAPSTONE").map(it => it.name);
  let order = DEFAULT_ORDER.slice();
  let cursor = 0; // number of missions "applied" so far
  let selected = null;
  let playTimer = null;

  const scrubber = document.getElementById("scrubber");
  const missionListEl = document.getElementById("missionList");
  const addSelect = document.getElementById("addMissionSelect");
  const missionCountEl = document.getElementById("missionCount");
  const orphanBox = document.getElementById("orphanBox");

  function revealedSet(uptoIdx) {
    const revealed = new Set();
    items.filter(it => it.tier === "CAPSTONE").forEach(it => revealed.add(it.name)); // always visible
    for (let i = 0; i < uptoIdx; i++) {
      const n = order[i];
      revealed.add(n);
      closureOf(n).forEach(d => revealed.add(d));
    }
    return revealed;
  }

  function firstRevealSteps() {
    const firstStep = {};
    for (let i = 0; i < order.length; i++) {
      const n = order[i];
      if (firstStep[n] == null) firstStep[n] = i + 1;
      closureOf(n).forEach(d => { if (firstStep[d] == null) firstStep[d] = i + 1; });
    }
    return firstStep;
  }

  function render() {
    scrubber.max = order.length;
    scrubber.value = cursor;
    const revealed = revealedSet(cursor);
    const justName = cursor > 0 ? order[cursor - 1] : null;
    items.forEach(it => {
      const { circ } = nodeEls[it.name];
      circ.classList.toggle("unrevealed", !revealed.has(it.name));
      circ.classList.toggle("revealed", revealed.has(it.name));
      circ.classList.toggle("just", it.name === justName);
      circ.classList.toggle("selected", it.name === selected);
    });
    edgeEls.forEach(e => {
      e.el.classList.toggle("hi", selected && (e.to === selected || e.from === selected));
    });

    document.getElementById("statRevealed").textContent = revealed.size;
    document.getElementById("statTotal").textContent = items.length;
    const orphans = items.filter(it => !order.includes(it.name) && !closureCoveredByOrder(it.name) && it.tier !== "CAPSTONE");
    document.getElementById("statOrphans").textContent = orphans.length;
    if (orphans.length) {
      orphanBox.style.display = "block";
      orphanBox.textContent = "Never revealed by this order: " + orphans.map(o => o.name).join(", ");
    } else {
      orphanBox.style.display = "none";
    }

    renderMissionList();
  }

  function closureCoveredByOrder(name) {
    return order.some(n => n === name || closureOf(n).has(name));
  }

  function renderMissionList() {
    missionCountEl.textContent = `(${order.length})`;
    const firstStep = firstRevealSteps();
    missionListEl.innerHTML = "";
    order.forEach((name, i) => {
      const it = byName[name];
      const row = document.createElement("div");
      row.className = "mrow" + (i === cursor - 1 ? " current" : "") + (i < cursor ? " done" : "");
      row.innerHTML = `
        <span class="idx">${i + 1}</span>
        <span class="em">${it.emoji.replace(/^(__).*(__)$/, "⭐")}</span>
        <span class="nm">${it.name}</span>
        <span class="av">${it.avgVisits != null ? it.avgVisits.toFixed(1) : "--"}</span>
        <span class="mbtns">
          <button class="small" data-act="up" data-i="${i}">↑</button>
          <button class="small" data-act="down" data-i="${i}">↓</button>
          <button class="small" data-act="rm" data-i="${i}">✕</button>
        </span>`;
      row.addEventListener("click", (e) => { if (!e.target.closest("button")) selectNode(name); });
      missionListEl.appendChild(row);
    });
    missionListEl.querySelectorAll("button[data-act]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const i = Number(btn.dataset.i), act = btn.dataset.act;
        if (act === "up" && i > 0) { [order[i-1],order[i]] = [order[i],order[i-1]]; }
        if (act === "down" && i < order.length - 1) { [order[i+1],order[i]] = [order[i],order[i+1]]; }
        if (act === "rm") { order.splice(i, 1); }
        cursor = Math.min(cursor, order.length);
        rebuildAddSelect();
        render();
      });
    });
    const cur = missionListEl.querySelector(".mrow.current");
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }

  function rebuildAddSelect() {
    addSelect.innerHTML = '<option value="">+ add item back to the order…</option>';
    items.filter(it => it.tier !== "CAPSTONE" && !order.includes(it.name))
      .sort((a,b) => a.name.localeCompare(b.name))
      .forEach(it => {
        const opt = document.createElement("option");
        opt.value = it.name; opt.textContent = `${it.emoji} ${it.name}`;
        addSelect.appendChild(opt);
      });
  }
  addSelect.addEventListener("change", () => {
    if (addSelect.value) { order.push(addSelect.value); rebuildAddSelect(); render(); addSelect.value = ""; }
  });

  function selectNode(name) {
    selected = selected === name ? null : name;
    const it = byName[name];
    const dp = document.getElementById("detailPane");
    if (!selected) { dp.innerHTML = '<span style="color:var(--mute)">Click a node in the graph for details.</span>'; }
    else {
      const chain = Array.from(closureOf(name));
      dp.innerHTML = `<b>${it.emoji} ${it.name}</b> — ${it.stations.join(", ")}, ${it.points}pt, avgVisits=${it.avgVisits != null ? it.avgVisits.toFixed(1) : "?"}<br>
        <span class="rec">${it.recipe}</span><br>
        ${chain.length ? `Depends on ${chain.length} item${chain.length===1?"":"s"}: ${chain.join(", ")}` : "No item-level dependencies (built directly from elements)."}`;
    }
    render();
  }

  // ---- controls -----------------------------------------------------------
  scrubber.addEventListener("input", () => { cursor = Number(scrubber.value); stopPlay(); render(); });
  document.getElementById("stepFwdBtn").addEventListener("click", () => { cursor = Math.min(order.length, cursor + 1); stopPlay(); render(); });
  document.getElementById("stepBackBtn").addEventListener("click", () => { cursor = Math.max(0, cursor - 1); stopPlay(); render(); });
  document.getElementById("resetSimBtn").addEventListener("click", () => { cursor = 0; stopPlay(); render(); });
  document.getElementById("resetOrderBtn").addEventListener("click", () => {
    order = DEFAULT_ORDER.slice(); cursor = 0; stopPlay(); rebuildAddSelect(); render();
  });

  const playBtn = document.getElementById("playBtn");
  function stopPlay() { clearInterval(playTimer); playTimer = null; playBtn.textContent = "▶ Play"; }
  playBtn.addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    playBtn.textContent = "⏸ Pause";
    playTimer = setInterval(() => {
      cursor++;
      if (cursor > order.length) { stopPlay(); cursor = order.length; }
      render();
    }, 220);
  });

  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ order }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "story_mission_order.json";
    a.click();
  });
  document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const incoming = Array.isArray(parsed) ? parsed : parsed.order;
        if (!Array.isArray(incoming)) throw new Error("expected {order:[...]} or [...]");
        order = incoming.filter(n => byName[n] && byName[n].tier !== "CAPSTONE");
        cursor = Math.min(cursor, order.length);
        rebuildAddSelect();
        render();
      } catch (err) { alert("Could not import: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  rebuildAddSelect();
  render();
})();
</script>
</body>
</html>
